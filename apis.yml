aid: sereact
name: Sereact
description: 'Sereact GmbH is a Stuttgart, Germany based physical-AI company building intelligent robotic
  systems for warehouse and fulfillment automation. Its "Cortex" platform pairs a Vision Language Action
  Model (VLAM) with robot control so robots can pick, place, sort, induct, and inspect diverse items in
  production without task-specific retraining, running across 50+ deployments in Europe and the US. Products
  include Pick-and-Place, Putwall, Induction, Bin Handling, Returns Handling, and the Lens perception
  system. Backed by Creandum and Point Nine; announced a $110M Series B. Sereact does not currently publish
  a public developer API, OpenAPI, or documentation surface — an internal api.sereact.ai host exists but is
  a placeholder. This profile captures the company identity and public web/GitHub surface.'
